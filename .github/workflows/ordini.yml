# Every 10 minutes: places paid spaces that are still waiting (free, no setup needed).
name: Sistema ordini
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ordini:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://www.getpixelhype.com/api/ordini
